name: escrow_pay
description: "Onchain P2P escrow payments on Solana."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Solana
  solana_kit: ^0.9.3
  solana_kit_mobile_wallet_adapter: ^0.5.3
  # Imported directly: neither type is re-exported by the umbrella package.
  solana_kit_rpc_api: ^0.9.3
  solana_kit_mobile_wallet_adapter_protocol: ^0.5.3

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Motion & type
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1

  # Utilities
  crypto: ^3.0.6
  convert: ^3.1.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

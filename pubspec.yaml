name: escrow_pay
description: "Onchain P2P escrow payments on Solana."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Solana
  solana_kit: ^0.9.3
  solana_kit_mobile_wallet_adapter: ^0.5.3
  # Imported directly: neither type is re-exported by the umbrella package.
  solana_kit_rpc_api: ^0.9.3
  solana_kit_mobile_wallet_adapter_protocol: ^0.5.3

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Motion & type
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1

  # Platform
  # Camera permission can be requested and re-requested in-app rather than
  # sending the user to system settings.
  #
  # Pinned to 12.x: permission_handler_android 14.x requires compileSdk 37,
  # which Android Gradle Plugin 9.0.1 does not support (it caps at 36). Revisit
  # when AGP catches up.
  permission_handler: ^12.0.3
  # Opens the Play Store when no wallet app is installed.
  url_launcher: ^6.3.2
  # Sharing a listing or release link through any app the phone has.
  share_plus: ^13.3.1
  # Receives escrowpay: links so a shared link opens the app and acts.
  app_links: ^7.2.1
  # Holds the buyer's release secrets. Keystore-backed on Android, so the
  # secret is not readable from a backup or by another app.
  flutter_secure_storage: ^11.2.0

  # Utilities
  crypto: ^3.0.6
  convert: ^3.1.2
  http: ^1.5.0
  # Retry-After can be an HTTP date; http does not export a parser for it.
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # tool/make_test_offer.dart builds a seller QR without a second device.
  # Already present transitively via qr_flutter; declared because we import it.
  qr: ^3.0.2

flutter:
  uses-material-design: true

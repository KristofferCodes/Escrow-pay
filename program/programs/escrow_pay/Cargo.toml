[package]
name = "escrow_pay"
version = "0.1.0"
description = "Onchain P2P escrow program for Escrow Pay"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Lowers MIN_TIMEOUT_SECONDS so integration tests can watch a deadline pass.
# Test-only — never enable this for a deployed build.
test-timeouts = []

[dependencies]
anchor-lang = "1.2.0"

# Anchor's derive and attribute macros expand to `cfg(feature = "...")` checks
# for features that live in anchor-lang, not here. Rust reports each as an
# unexpected cfg, which buries genuine warnings. Accept exactly these four.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("anchor-debug", "solana", "custom-panic", "custom-heap"))',
] }

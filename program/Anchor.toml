[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow_pay = "5pY9AH8qYE6u17MYknPeoy9HufpguEAt9Lj1vnoXqzNC"

[programs.devnet]
escrow_pay = "5pY9AH8qYE6u17MYknPeoy9HufpguEAt9Lj1vnoXqzNC"

# Localnet, deliberately. `anchor test` deploys to whatever this says, so
# pointing it at devnet makes every test run depend on a funded devnet wallet
# and the public faucet. Deploy to devnet explicitly instead:
#   anchor deploy --provider.cluster devnet
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
